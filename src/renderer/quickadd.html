<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';" />
  <title>Quick Add</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="quick-window">
  <div class="quick-card" id="quick-card">
    <div class="quick-row">
      <span class="quick-plus" id="quick-plus"></span>
      <input type="text" id="quick-input" placeholder="Task name" autocomplete="off" spellcheck="false" />
      <button class="icon-btn quick-close" id="quick-close" title="Close (Esc)" aria-label="Close"></button>
      <button class="quick-submit" id="quick-submit" title="Add task (Enter)" aria-label="Add task"></button>
    </div>
    <div class="quick-hint" id="quick-hint"></div>
  </div>

  <script src="icons.js"></script>
  <script src="nlp.js"></script>
  <script src="quickadd.js"></script>
</body>
</html>
